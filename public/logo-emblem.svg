<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emblemGold" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#FFF9EE" />
      <stop offset="18%" stop-color="#EAD3AC" />
      <stop offset="45%" stop-color="#CDB080" />
      <stop offset="75%" stop-color="#B9965E" />
      <stop offset="92%" stop-color="#95733B" />
      <stop offset="100%" stop-color="#7A5824" />
    </linearGradient>

    <linearGradient id="emblemBevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#F4E2C2" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8A6832" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="emblemBevelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6B4C1E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#30200A" stop-opacity="0.85" />
    </linearGradient>

    <filter id="emblemDropShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.8" flood-color="#2B1B07" flood-opacity="0.38" />
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-color="#180F03" flood-opacity="0.2" />
    </filter>
  </defs>

  <g filter="url(#emblemDropShadow)">
    <!-- Circular Ring Border -->
    <circle cx="250" cy="250" r="185" stroke="url(#emblemGold)" stroke-width="12" fill="none" />
    <circle cx="250" cy="250" r="190.5" stroke="url(#emblemBevelLight)" stroke-width="1.4" fill="none" opacity="0.7" />
    <circle cx="250" cy="250" r="179.5" stroke="url(#emblemBevelDark)" stroke-width="1.4" fill="none" opacity="0.6" />

    <!-- KP Monogram -->
    <g fill="url(#emblemGold)">
      <!-- K Left Vertical Pillar -->
      <path d="M 175,148 L 199,148 L 199,352 L 175,352 Z" />
      <!-- K Top Left Serif -->
      <path d="M 175,148 L 163,148 C 170,154 175,160 175,170 L 175,148 Z" />
      <!-- K Bottom Left Serif -->
      <path d="M 175,352 L 163,352 C 170,346 175,340 175,330 L 175,352 Z" />
      <!-- K Bottom Right Serif -->
      <path d="M 199,352 L 211,352 C 204,346 199,340 199,330 L 199,352 Z" />

      <!-- P Vertical Stem (Center) -->
      <path d="M 235,148 L 257,148 L 257,298 L 235,298 Z" />

      <!-- K Upper Diagonal Arm -->
      <path d="M 199,238 L 268,148 L 290,148 L 213,248 Z" />

      <!-- K Lower Diagonal Leg -->
      <path d="M 235,236 L 324,352 L 348,352 L 257,236 Z" />
      <!-- K Lower Leg Foot Serif -->
      <path d="M 348,352 L 360,352 C 353,346 348,340 348,330 L 348,352 Z" />

      <!-- P Loop -->
      <path d="M 257,148 L 296,148 C 334,148 358,168 358,200 C 358,232 334,252 296,252 L 257,252 Z M 257,170 L 257,230 L 294,230 C 318,230 334,218 334,200 C 334,182 318,170 294,170 Z" />
    </g>

    <!-- Bevel Detail Strokes for Real Chiseled 3D Monogram Effect -->
    <path d="M 175,148 L 175,352" stroke="url(#emblemBevelLight)" stroke-width="1.8" opacity="0.85" />
    <path d="M 199,148 L 199,352" stroke="url(#emblemBevelDark)" stroke-width="1.5" opacity="0.7" />
    <path d="M 235,148 L 235,298" stroke="url(#emblemBevelLight)" stroke-width="1.8" opacity="0.85" />
    <path d="M 257,148 L 257,298" stroke="url(#emblemBevelDark)" stroke-width="1.5" opacity="0.7" />
    <path d="M 199,238 L 268,148" stroke="url(#emblemBevelLight)" stroke-width="1.8" opacity="0.9" />
    <path d="M 257,236 L 348,352" stroke="url(#emblemBevelDark)" stroke-width="1.8" opacity="0.75" />
    <path d="M 257,148 L 296,148 C 334,148 358,168 358,200" stroke="url(#emblemBevelLight)" stroke-width="1.8" opacity="0.85" />
    <path d="M 358,200 C 358,232 334,252 296,252 L 257,252" stroke="url(#emblemBevelDark)" stroke-width="1.8" opacity="0.75" />
  </g>
</svg>
