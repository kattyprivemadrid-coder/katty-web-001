<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- 3D Gold Gradient for Face -->
    <linearGradient id="goldSurface" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#FFF9EE" />
      <stop offset="18%" stop-color="#EAD3AC" />
      <stop offset="45%" stop-color="#CDB080" />
      <stop offset="75%" stop-color="#B9965E" />
      <stop offset="92%" stop-color="#95733B" />
      <stop offset="100%" stop-color="#7A5824" />
    </linearGradient>

    <!-- Bevel Top-Left Light Highlight -->
    <linearGradient id="bevelLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#F4E2C2" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#8A6832" stop-opacity="0" />
    </linearGradient>

    <!-- Bevel Bottom-Right Dark Shadow -->
    <linearGradient id="bevelDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#6B4C1E" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#30200A" stop-opacity="0.85" />
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="luxDropShadow" x="-15%" y="-20%" width="130%" height="145%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="1.8" flood-color="#2B1B07" flood-opacity="0.35" />
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.6" flood-color="#180F03" flood-opacity="0.2" />
    </filter>
  </defs>

